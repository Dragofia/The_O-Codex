<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Vibrant Astral Blue Outline Gradient -->
    <linearGradient id="blueOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Darker Planetary Accretion Ring -->
    <linearGradient id="darkRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="35%" stop-color="#1e40af" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Center singularity mask so the inner hole remains clear -->
    <mask id="singularityMask">
      <rect x="-20" y="-20" width="104" height="104" fill="white" />
      <circle cx="32" cy="32" r="13.5" fill="black" />
    </mask>
  </defs>

  <!-- 25° Tilted Planetary Ring - Back Arc (behind the O) -->
  <g transform="rotate(-25 32 32)">
    <!-- Back dark shadow for depth -->
    <path d="M 1 32 A 31 9 0 0 1 63 32"
          fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <!-- Back ring body: thicker and bolder -->
    <path d="M 1 32 A 31 9 0 0 1 63 32"
          fill="none" stroke="url(#darkRingGrad)" stroke-width="4.2" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- The Obsidian 'O': Pitch Black Inside with Thinner Razor-Crisp Blue Outline -->
  <!-- 1. Pure Jet Black / Obsidian Solid Body -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#000000" stroke-width="9" />

  <!-- 2. Thinner Blue Outer Event-Horizon Outline -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#blueOutline)" stroke-width="1.1" />

  <!-- 3. Thinner Blue Inner Singularity Outline -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#blueOutline)" stroke-width="1.1" />

  <!-- 25° Tilted Planetary Ring - Front Arc (in front of the O, masked at center hole) -->
  <g transform="rotate(-25 32 32)" mask="url(#singularityMask)">
    <!-- Front dark shadow underlay -->
    <path d="M 63 32 A 31 9 0 0 1 1 32"
          fill="none" stroke="#000000" stroke-width="6.2" stroke-linecap="round" opacity="0.75" />
    <!-- Front ring body: thicker and bolder -->
    <path d="M 63 32 A 31 9 0 0 1 1 32"
          fill="none" stroke="url(#darkRingGrad)" stroke-width="4.2" stroke-linecap="round" />
    <!-- Luminous accretion highlight line along the ring -->
    <path d="M 59 32.5 A 28 8.2 0 0 1 5 32.5"
          fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
  </g>
</svg>
