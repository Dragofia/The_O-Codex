<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Vibrant Blue O Gradient -->
    <linearGradient id="blueOGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Planetary Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Mask to keep the inner hole of the O 100% crystal clean -->
    <mask id="holeMask">
      <!-- Everything white is shown -->
      <rect x="-20" y="-20" width="104" height="104" fill="white" />
      <!-- Black circle cuts out the center hole so the ring never crosses into the O's center -->
      <circle cx="32" cy="32" r="14" fill="black" />
    </mask>
  </defs>

  <!-- Planetary Ring Back Arc (behind the O) -->
  <g transform="rotate(-25 32 32)">
    <path d="M 1 32 A 31 8.5 0 0 1 63 32"
          fill="none" stroke="url(#ringGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- The Bold Blue "O" (dominant, clean, instantly recognizable) -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="url(#blueOGrad)" stroke-width="8.5" />

  <!-- Planetary Ring Front Arc (passes in front of the O, but masked away from the inner hole) -->
  <g transform="rotate(-25 32 32)" mask="url(#holeMask)">
    <path d="M 63 32 A 31 8.5 0 0 1 1 32"
          fill="none" stroke="url(#ringGrad)" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>