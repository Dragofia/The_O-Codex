<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Astral Obsidian O Body: deep obsidian core with glowing event-horizon tones -->
    <linearGradient id="obsidianO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="85%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Astral Rim Glow (Event Horizon edge) -->
    <linearGradient id="astralRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Darker, Substantial Planetary Ring (Accretion Disc vibe) -->
    <linearGradient id="darkRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="30%" stop-color="#1e40af" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Center hole mask to preserve pure hollow 'O' clarity -->
    <mask id="singularityMask">
      <rect x="-20" y="-20" width="104" height="104" fill="white" />
      <circle cx="32" cy="32" r="14" fill="black" />
    </mask>
  </defs>

  <!-- 25° Tilted Planetary / Accretion Ring - Back Arc (behind the O) -->
  <g transform="rotate(-25 32 32)">
    <!-- Back dark shadow halo of the ring for depth -->
    <path d="M 1 32 A 31 9 0 0 1 63 32"
          fill="none" stroke="#020617" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <!-- Back ring body -->
    <path d="M 1 32 A 31 9 0 0 1 63 32"
          fill="none" stroke="url(#darkRingGrad)" stroke-width="3.4" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- The Astral Obsidian 'O' (Black Hole Singularity / Event Horizon Body) -->
  <!-- Base Obsidian Body -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="url(#obsidianO)" stroke-width="9" />
  <!-- Crisp Astral Edge / Event Horizon highlight -->
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="url(#astralRim)" stroke-width="1.2" opacity="0.9" />
  <circle cx="32" cy="32" r="14.2" fill="none" stroke="url(#astralRim)" stroke-width="1" opacity="0.75" />

  <!-- 25° Tilted Planetary / Accretion Ring - Front Arc (in front of the O, masked at center) -->
  <g transform="rotate(-25 32 32)" mask="url(#singularityMask)">
    <!-- Front dark shadow underlay for obsidian contrast -->
    <path d="M 63 32 A 31 9 0 0 1 1 32"
          fill="none" stroke="#020617" stroke-width="5.2" stroke-linecap="round" opacity="0.6" />
    <!-- Front ring body: darker, noticeable, substantial cosmic band -->
    <path d="M 63 32 A 31 9 0 0 1 1 32"
          fill="none" stroke="url(#darkRingGrad)" stroke-width="3.4" stroke-linecap="round" />
    <!-- Core luminous streak along the accretion ring -->
    <path d="M 58 32.5 A 28 8.2 0 0 1 6 32.5"
          fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
  </g>
</svg>
