<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Main O Gradient -->
    <linearGradient id="blueOGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="1" />
    </linearGradient>

    <!-- Glow Filter for crisp render -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark circular backing so it pops on dark and light browser tabs -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Back arc of the orbital ring -->
  <path d="M 12 39 C 14 47, 42 47, 52 33" fill="none" stroke="url(#orbitGrad)" stroke-width="2.2" stroke-dasharray="2 1" stroke-opacity="0.6" />

  <!-- The Stylized 'O' Body (Crisp, bold, geometric fantasy glyph) -->
  <path fill-rule="evenodd" fill="url(#blueOGrad)" filter="url(#cyanGlow)"
        d="M 32 11
           C 43.5 11, 51 19.5, 51 32
           C 51 44.5, 43.5 53, 32 53
           C 20.5 53, 13 44.5, 13 32
           C 13 19.5, 20.5 11, 32 11 Z
           M 32 20
           C 25 20, 21.5 25, 21.5 32
           C 21.5 39, 25 44, 32 44
           C 39 44, 42.5 39, 42.5 32
           C 42.5 25, 39 20, 32 20 Z" />

  <!-- Front arc of the glowing cosmic orbit crossing through the O -->
  <path d="M 10 33 C 14 20, 48 19, 54 26" fill="none" stroke="url(#orbitGrad)" stroke-width="2.6" stroke-linecap="round" />

  <!-- Celestial spark / node on the orbit ring -->
  <circle cx="49" cy="23" r="2.4" fill="#ffffff" />
  <circle cx="49" cy="23" r="4" fill="#38bdf8" fill-opacity="0.4" />

  <!-- Center subtle celestial diamond rune in the core of the O -->
  <polygon points="32,27 34.5,32 32,37 29.5,32" fill="#7dd3fc" fill-opacity="0.85" />
</svg>
